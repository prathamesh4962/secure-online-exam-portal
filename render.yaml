services:
  - type: web
    name: secure-exam-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn backend.wsgi:application
    healthCheckPath: /api/csrf/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URLS
        value: https://frontend-one-mauve-83.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: secure-exam-db
          property: connectionString

databases:
  - name: secure-exam-db
    databaseName: secure_exam_portal
    user: secure_exam_user
    plan: 0.1c-256mb
