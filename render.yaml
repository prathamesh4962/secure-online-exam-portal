services:
  - type: web
    name: secure-exam-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn backend.wsgi:application
    healthCheckPath: /api/csrf/
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URLS
        value: https://frontend-one-mauve-83.vercel.app,https://secure-exam-portal.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: secure-exam-db
          property: connectionString

  - type: web
    name: secure-exam-portal
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://secure-exam-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: secure-exam-db
    databaseName: secure_exam_portal
    user: secure_exam_user
    plan: 0.1c-256mb
